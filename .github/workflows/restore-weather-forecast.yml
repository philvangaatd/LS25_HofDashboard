name: Restore farm overview weather

on:
  push:
    paths:
      - '.github/workflows/restore-weather-forecast.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore weather forecast wiring
        run: python3 .github/scripts/restore_weather_forecast.py

      - name: Validate PHP syntax
        run: php -l api.php

      - name: Verify weather contract
        run: |
          grep -q "get_weather_forecast(\$dir, \$currentDayLive, 5)" api.php
          grep -q "function get_weather_forecast" api.php
          grep -q "renderWeatherForecast(data.weatherForecast)" index.html
          grep -q "weatherForecastContainer" index.html

      - name: Validate diff
        run: git diff --check

      - name: Commit weather fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api.php
          git diff --cached --quiet || git commit -m "fix: restore farm overview weather forecast"
          git push
