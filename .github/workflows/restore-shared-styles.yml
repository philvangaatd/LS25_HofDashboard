name: Restore shared dashboard styles

on:
  push:
    paths:
      - '.github/workflows/restore-shared-styles.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore shared styles
        run: python3 .github/scripts/restore_shared_bar_styles.py

      - name: Validate embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          Path('/tmp/dashboard-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/dashboard-inline.js

      - name: Verify shared UI contract
        run: |
          grep -q '.bar-row { display: flex;' index.html
          grep -q '.bar-track { flex: 1;' index.html
          grep -q '.bar-fill-progress' index.html
          grep -q '.weather-row { display: flex;' index.html
          grep -q 'vehicle-meta-grid' index.html
          grep -q 'animal-kpi-grid' index.html

      - name: Validate diff
        run: git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: restore shared progress bar styles"
          git push
