name: Polish vehicle cards

on:
  push:
    paths:
      - '.github/workflows/polish-vehicle-cards.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply vehicle card polish
        run: python3 .github/scripts/polish_vehicle_cards.py

      - name: Validate embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          Path('/tmp/dashboard-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/dashboard-inline.js

      - name: Verify vehicle UI contract
        run: |
          grep -q 'vehicle-meta-grid' index.html
          grep -q 'vehicle-condition-grid' index.html
          grep -q 'vehicle-fill-grid' index.html
          grep -q 'Kraftstoff & Betriebsstoffe' index.html
          grep -q 'Wartung empfohlen' index.html
          grep -q 'Waschen empfohlen' index.html
          grep -q "api.php?action=vehicles_data" index.html

      - name: Validate diff
        run: git diff --check

      - name: Commit frontend polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: polish vehicle cards"
          git push
