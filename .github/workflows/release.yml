name: Build and release dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve and validate versions
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dashboard = Get-Content -Raw -LiteralPath "app-manifest.json" | ConvertFrom-Json
          $launcher = Get-Content -Raw -LiteralPath "launcher/launcher-manifest.json" | ConvertFrom-Json
          [xml]$project = Get-Content -Raw -LiteralPath "launcher/HofDashboard.Launcher/HofDashboard.Launcher.csproj"
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $version = [string]$dashboard.version
          $minimumModVersion = [string]$dashboard.minimumModVersion
          if ($launcher.version -ne $version -or $launcher.dashboardVersion -ne $version -or $projectVersion -ne $version) {
            throw "Dashboard/launcher/project version mismatch."
          }
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "minimum_mod_version=$minimumModVersion" >> $env:GITHUB_OUTPUT
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            "publish=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists; skipping publication."
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
          }

      - name: Validate frontend assets
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        run: |
          foreach ($file in @(
            "assets/js/app-state.js",
            "assets/js/app-init-savegame.js",
            "assets/js/mod-manager.js",
            "assets/js/app-shell.js",
            "assets/js/app-shell-sync.js",
            "assets/js/sidebar-collapse.js",
            "assets/js/near-live.js",
            "assets/js/live-refresh-ux.js",
            "assets/js/live-map.js",
            "assets/js/ux-polish.js"
          )) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw "JavaScript validation failed: $file" }
          }

          foreach ($file in @(
            "assets/css/start-screen.css",
            "assets/css/start-screen-icon-fix.css",
            "assets/css/app-shell.css",
            "assets/css/sidebar-collapse.css",
            "assets/css/header-cleanup.css",
            "assets/css/mod-manager.css",
            "assets/css/live-map.css",
            "assets/css/ux-polish.css"
          )) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing UI asset: $file" }
          }

          foreach ($retired in @(
            "assets/css/storage.css",
            "assets/js/start-nav-sync.js",
            "assets/css/start-nav-sync.css"
          )) {
            if (Test-Path -LiteralPath $retired) { throw "Retired asset still exists: $retired" }
          }

          $appState = Get-Content -Raw -LiteralPath "assets/js/app-state.js"
          if ($appState -match 'installStorageTab|tabStorage|loadStorageData') {
            throw "Retired Vorräte implementation is still present in app-state.js"
          }

      - name: Wire release assets and cache busters
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $indexPath = "index.html"
          $index = Get-Content -Raw -LiteralPath $indexPath
          if ($index -notmatch 'assets/css/live-map\.css') {
            $index = $index.Replace(
              '<link rel="stylesheet" href="assets/css/app.css">',
              '<link rel="stylesheet" href="assets/css/app.css">' + [Environment]::NewLine + '<link rel="stylesheet" href="assets/css/live-map.css">'
            )
          }
          if ($index -notmatch 'assets/css/ux-polish\.css') {
            $index = $index.Replace(
              '<link rel="stylesheet" href="assets/css/live-map.css">',
              '<link rel="stylesheet" href="assets/css/live-map.css">' + [Environment]::NewLine + '<link rel="stylesheet" href="assets/css/ux-polish.css">'
            )
          }
          if ($index -notmatch 'assets/js/live-map\.js') {
            $index = $index.Replace(
              '<script src="assets/js/ui-utils.js"></script>',
              '<script src="assets/js/ui-utils.js"></script>' + [Environment]::NewLine + '<script src="assets/js/live-map.js"></script>'
            )
          }
          if ($index -notmatch 'assets/js/ux-polish\.js') {
            $index = $index.Replace(
              '<script src="assets/js/live-map.js"></script>',
              '<script src="assets/js/live-map.js"></script>' + [Environment]::NewLine + '<script src="assets/js/ux-polish.js"></script>'
            )
          }

          # Version every local JS/CSS asset in the shipped HTML. This avoids stale
          # WebView2 resources after in-place application updates.
          $pattern = '(src|href)="(assets/(?:js|css)/[^"?]+)(?:\?v=[^"]*)?"'
          $index = [regex]::Replace($index, $pattern, {
            param($match)
            return $match.Groups[1].Value + '="' + $match.Groups[2].Value + '?v=' + $env:VERSION + '"'
          })
          Set-Content -LiteralPath $indexPath -Value $index -Encoding utf8
          $wiredIndex = Get-Content -Raw -LiteralPath $indexPath
          foreach ($asset in @('live-map','ux-polish')) {
            if ($wiredIndex -notmatch ('assets/js/' + [regex]::Escape($asset) + '\.js\?v=')) {
              throw "$asset.js was not wired/versioned in index.html"
            }
          }
          foreach ($asset in @('live-map','ux-polish')) {
            if ($wiredIndex -notmatch ('assets/css/' + [regex]::Escape($asset) + '\.css\?v=')) {
              throw "$asset.css was not wired/versioned in index.html"
            }
          }

          $mainFormPath = "launcher/HofDashboard.Launcher/MainForm.cs"
          $mainForm = Get-Content -Raw -LiteralPath $mainFormPath
          foreach ($asset in @('app-shell','app-shell-sync','sidebar-collapse','near-live','live-refresh-ux')) {
            $assetPattern = 'assets/js/' + [regex]::Escape($asset) + '\.js\?v=[0-9.]+'
            $replacement = 'assets/js/' + $asset + '.js?v=' + $env:VERSION
            $mainForm = [regex]::Replace($mainForm, $assetPattern, $replacement)
          }
          foreach ($asset in @('start-screen-icon-fix','sidebar-collapse','header-cleanup','mod-manager')) {
            $assetPattern = 'assets/css/' + [regex]::Escape($asset) + '\.css\?v=[0-9.]+'
            $replacement = 'assets/css/' + $asset + '.css?v=' + $env:VERSION
            $mainForm = [regex]::Replace($mainForm, $assetPattern, $replacement)
          }
          Set-Content -LiteralPath $mainFormPath -Value $mainForm -Encoding utf8

      - name: Verify matching mod release
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MOD_VERSION: ${{ steps.meta.outputs.minimum_mod_version }}
        run: |
          gh release view "v$env:MOD_VERSION" --repo philvangaatd/LS25_HofDashboardMod *> $null
          $modReleaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if (-not $modReleaseExists) {
            throw "Required mod release v$env:MOD_VERSION does not exist yet."
          }

      - name: Build Windows package
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        run: ./launcher/scripts/build-prototype.ps1 -ArtifactDirectory dist

      - name: Add verified mod metadata
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        run: ./launcher/scripts/enrich-update-manifest.ps1 -ManifestPath dist/update-manifest.json

      - name: Verify release assets
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $package = "dist/HofDashboard-win-x64-v$env:VERSION.zip"
          foreach ($file in @($package, "dist/update-manifest.json")) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release asset: $file" }
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash.ToLowerInvariant()
          Write-Host "Dashboard SHA-256: $hash"

          $manifest = Get-Content -Raw -LiteralPath "dist/update-manifest.json" | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$manifest.mod.sha256) -or
              [string]$manifest.mod.sha256 -notmatch '^[0-9a-f]{64}$' -or
              [long]$manifest.mod.sizeBytes -le 0) {
            throw "Update manifest is missing verified mod package metadata."
          }
          Write-Host "Mod SHA-256: $($manifest.mod.sha256)"
          Write-Host "Mod size: $($manifest.mod.sizeBytes) bytes"

      - name: Publish GitHub release
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $package = "dist/HofDashboard-win-x64-v$env:VERSION.zip"
          $notes = @"
          ## LS25 Hof-Dashboard v$env:VERSION

          ### Tiere
          - neuer Tierart-Filter mit automatisch erkannten Tierarten und Bienenhaltung
          - gefilterte Ansichten blenden die hofweite Futterprognose aus, damit keine Daten anderer Tierarten vermischt werden

          ### Übersicht & Fuhrpark
          - Fuhrpark-Card auf der Übersicht öffnet jetzt direkt den Fuhrpark
          - Fuhrpark-Cards werden in einem eigenen gleich hohen Kartenraster dargestellt
          - Wartungs-/Waschbedarf über 50 Prozent erhält wieder einen vollständigen roten Warnrahmen

          ### Hinweise & Navigation
          - Legenden und erklärende Hinweise wurden an das Ende der jeweiligen Tabs verschoben und deutlich dezenter gestaltet
          - der Kartenbild-Hinweis steht jetzt unter der Karte statt im Mehr-Menü
          - Marker-/Karten-Menüs verwenden einheitliche Zeilenhöhen und Icon-Ausrichtung
          - redundante Aktualisieren-Buttons wurden aus Live-, Planungs- und Systemansichten entfernt
          - Marker behält Neu laden; die Karte erhält ebenfalls einen sicheren AutoDrive-Neuladen-Button mit Dirty-Check

          ### Kompatibilität
          - Live-Mod v${{ steps.meta.outputs.minimum_mod_version }} bleibt unverändert kompatibel; für dieses UI-Release ist kein neues Mod-Paket nötig
          "@
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8
          gh release create $env:TAG $package "dist/update-manifest.json" --repo $env:GITHUB_REPOSITORY --title "LS25 Hof-Dashboard v$env:VERSION" --notes-file release-notes.md
