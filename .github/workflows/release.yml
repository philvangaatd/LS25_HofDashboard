name: Build and release dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve and validate versions
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dashboard = Get-Content -Raw -LiteralPath "app-manifest.json" | ConvertFrom-Json
          $launcher = Get-Content -Raw -LiteralPath "launcher/launcher-manifest.json" | ConvertFrom-Json
          [xml]$project = Get-Content -Raw -LiteralPath "launcher/HofDashboard.Launcher/HofDashboard.Launcher.csproj"
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $version = [string]$dashboard.version
          $minimumModVersion = [string]$dashboard.minimumModVersion
          if ($launcher.version -ne $version -or $launcher.dashboardVersion -ne $version -or $projectVersion -ne $version) {
            throw "Dashboard/launcher/project version mismatch."
          }
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "minimum_mod_version=$minimumModVersion" >> $env:GITHUB_OUTPUT
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            "publish=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists; skipping publication."
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
          }

      - name: Validate frontend assets
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        run: |
          node --check assets/js/app-state.js
          node --check assets/js/app-init-savegame.js
          node --check assets/js/mod-manager.js
          node --check assets/js/app-shell.js
          node --check assets/js/app-shell-sync.js
          node --check assets/js/sidebar-collapse.js
          node --check assets/js/start-nav-sync.js
          node --check assets/js/near-live.js
          node --check assets/js/live-refresh-ux.js
          foreach ($file in @(
            "assets/css/start-screen.css",
            "assets/css/start-screen-icon-fix.css",
            "assets/css/start-nav-sync.css",
            "assets/css/app-shell.css",
            "assets/css/sidebar-collapse.css",
            "assets/css/header-cleanup.css",
            "assets/css/mod-manager.css"
          )) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing UI asset: $file" }
          }

      - name: Verify matching mod release
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MOD_VERSION: ${{ steps.meta.outputs.minimum_mod_version }}
        run: |
          gh release view "v$env:MOD_VERSION" --repo philvangaatd/LS25_HofDashboardMod *> $null
          $modReleaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if (-not $modReleaseExists) {
            throw "Required mod release v$env:MOD_VERSION does not exist yet."
          }

      - name: Build Windows package
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        run: ./launcher/scripts/build-prototype.ps1 -ArtifactDirectory dist

      - name: Add verified mod metadata
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        run: ./launcher/scripts/enrich-update-manifest.ps1 -ManifestPath dist/update-manifest.json

      - name: Verify release assets
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $package = "dist/HofDashboard-win-x64-v$env:VERSION.zip"
          foreach ($file in @($package, "dist/update-manifest.json")) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release asset: $file" }
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash.ToLowerInvariant()
          Write-Host "Dashboard SHA-256: $hash"

          $manifest = Get-Content -Raw -LiteralPath "dist/update-manifest.json" | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$manifest.mod.sha256) -or
              [string]$manifest.mod.sha256 -notmatch '^[0-9a-f]{64}$' -or
              [long]$manifest.mod.sizeBytes -le 0) {
            throw "Update manifest is missing verified mod package metadata."
          }
          Write-Host "Mod SHA-256: $($manifest.mod.sha256)"
          Write-Host "Mod size: $($manifest.mod.sizeBytes) bytes"

      - name: Publish GitHub release
        if: steps.meta.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $package = "dist/HofDashboard-win-x64-v$env:VERSION.zip"
          $notes = @"
          ## LS25 Hof-Dashboard v$env:VERSION

          ### Einheitliche Navigation
          - Startscreen und geöffneter Spielstand verwenden jetzt dieselben Menüpunkte, Bezeichnungen und dieselbe Reihenfolge
          - Dashboard heißt auf beiden Seiten einheitlich Übersicht
          - Fahrzeuge heißt auf beiden Seiten einheitlich Fuhrpark
          - Markt, Verträge, Marker und Karte sind jetzt auch im Startscreen sichtbar
          - der nicht mehr vorhandene Navigationspunkt Einstellungen wurde aus dem Startscreen entfernt
          - die Bereiche Hof, Planung und AutoDrive entsprechen jetzt der Hauptnavigation

          ### Verhalten im Startscreen
          - spielstandsabhängige Punkte bleiben bis zur Auswahl eines Spielstands deaktiviert
          - Start und System bleiben direkt bedienbar
          - der Mod-/Systemstatus bleibt nach dem Neuaufbau der Navigation erhalten

          ### Kompatibilität
          Die Live-Mod bleibt unverändert bei mindestens v${{ steps.meta.outputs.minimum_mod_version }}.
          "@
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8
          gh release create $env:TAG $package "dist/update-manifest.json" --repo $env:GITHUB_REPOSITORY --title "LS25 Hof-Dashboard v$env:VERSION" --notes-file release-notes.md
