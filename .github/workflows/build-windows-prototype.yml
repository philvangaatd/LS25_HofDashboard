name: Build Windows app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build prototype package
        shell: pwsh
        run: ./launcher/scripts/build-prototype.ps1

      - name: Exercise persistent user-data layout
        shell: pwsh
        run: |
          $package = Join-Path $PWD "dist\HofDashboard-win-x64-v5.0.0"
          $php = Join-Path $package "runtime\php.exe"
          $phpIni = Join-Path $package "runtime\php.ini"
          $web = Join-Path $package "web"
          $fsRoot = Join-Path $env:USERPROFILE "Documents\My Games\FarmingSimulator2025"
          $dataRoot = Join-Path $env:RUNNER_TEMP "HofDashboard-data-test"
          New-Item -ItemType Directory -Force -Path $fsRoot, $dataRoot | Out-Null
          $env:HOF_DASHBOARD_DATA_DIR = $dataRoot
          Push-Location $web
          try {
            & $php -c $phpIni -r '
              require "config.php";
              require "user_settings.php";

              $expectedAssets = getenv("HOF_DASHBOARD_DATA_DIR") . DIRECTORY_SEPARATOR . "assets";
              $expectedSettings = getenv("HOF_DASHBOARD_DATA_DIR") . DIRECTORY_SEPARATOR . "settings";
              if (APP_DATA_DIR !== getenv("HOF_DASHBOARD_DATA_DIR")
                  || MAP_ASSETS_DIR !== $expectedAssets
                  || USER_SETTINGS_DIR !== $expectedSettings
                  || !is_dir(MAP_ASSETS_DIR)
                  || !is_writable(MAP_ASSETS_DIR)
                  || !is_dir(USER_SETTINGS_DIR)
                  || !is_writable(USER_SETTINGS_DIR)) {
                  throw new RuntimeException("Persistent app-data layout failed");
              }

              $first = default_user_settings();
              $first["terrainAlign"] = ["offsetX" => 125.5, "offsetZ" => -42, "scale" => 2];
              $first["priceAlerts"]["WHEAT"] = 450;
              $first["fieldTasks"]["12:Düngen"] = true;
              save_user_settings("savegame1", $first);

              $second = default_user_settings();
              $second["priceAlerts"]["BARLEY"] = 375;
              save_user_settings("savegame2", $second);

              $loadedFirst = load_user_settings("savegame1");
              $loadedSecond = load_user_settings("savegame2");
              if ($loadedFirst["terrainAlign"]["offsetX"] !== 125.5
                  || $loadedFirst["priceAlerts"]["WHEAT"] !== 450.0
                  || ($loadedFirst["fieldTasks"]["12:Düngen"] ?? false) !== true
                  || isset($loadedFirst["priceAlerts"]["BARLEY"])
                  || $loadedSecond["priceAlerts"]["BARLEY"] !== 375.0
                  || isset($loadedSecond["priceAlerts"]["WHEAT"])) {
                  throw new RuntimeException("Per-savegame user-settings round trip failed");
              }
            '
            if ($LASTEXITCODE -ne 0) {
              throw "Persistent user-data validation failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

      - name: Exercise packaged launcher and PHP healthcheck
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\HofDashboard-win-x64-v5.0.0\HofDashboard.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA "HofDashboard\logs\launcher.log"
            if (Test-Path $log) {
              Get-Content $log
            }
            throw "Launcher smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Exercise verified updater and preserve unrelated files
        shell: pwsh
        run: |
          $package = Join-Path $PWD "dist\HofDashboard-win-x64-v5.0.0"
          $testRoot = Join-Path $env:RUNNER_TEMP "HofDashboard-update-test"
          $installed = Join-Path $testRoot "installed"
          $helper = Join-Path $testRoot "HofDashboard.UpdateHelper.exe"
          if (Test-Path $testRoot) {
            Remove-Item -LiteralPath $testRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $installed | Out-Null
          Set-Content -LiteralPath (Join-Path $installed "user-note.txt") -Value "preserve-me"
          Copy-Item -LiteralPath (Join-Path $package "HofDashboard.exe") -Destination $helper

          $process = Start-Process -FilePath $helper -ArgumentList @(
            "--apply-update",
            "--parent-process-id", "0",
            "--staging", $package,
            "--target", $installed,
            "--no-restart"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA "HofDashboard\logs\launcher.log"
            if (Test-Path $log) {
              Get-Content $log
            }
            throw "Updater smoke test failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path (Join-Path $installed "HofDashboard.exe"))
              -or -not (Test-Path (Join-Path $installed "package-files.json"))
              -or (Get-Content -Raw -LiteralPath (Join-Path $installed "user-note.txt")).Trim() -ne "preserve-me") {
            throw "Updater did not install the package or preserve an unrelated file."
          }

      - name: Validate generated update manifest
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw -LiteralPath "dist\update-manifest.json" | ConvertFrom-Json
          $zip = Join-Path $PWD "dist\HofDashboard-win-x64-v5.0.0.zip"
          if ($manifest.schemaVersion -ne 1
              -or $manifest.application.version -ne "5.0.0"
              -or $manifest.application.sizeBytes -ne (Get-Item -LiteralPath $zip).Length
              -or $manifest.application.sha256 -ne (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()) {
            throw "Generated update manifest does not match the Windows package."
          }

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: HofDashboard-win-x64-v5.0.0
          path: |
            dist/HofDashboard-win-x64-v5.0.0.zip
            dist/update-manifest.json
          if-no-files-found: error
          retention-days: 14
