name: Redesign animal cards

on:
  push:
    paths:
      - '.github/workflows/redesign-animal-cards.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply animal card redesign
        run: python3 .github/scripts/redesign_animal_cards.py

      - name: Validate embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          Path('/tmp/dashboard-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/dashboard-inline.js

      - name: Verify redesign contract
        run: |
          grep -q 'function renderAnimalKpi(label, value)' index.html
          grep -q 'animal-kpi-grid' index.html
          grep -q 'animal-output-grid' index.html
          grep -q 'animal-food-grid' index.html
          grep -q "api.php?action=animals_data" index.html

      - name: Validate diff
        run: git diff --check

      - name: Commit frontend redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: improve animal card layout"
          git push
