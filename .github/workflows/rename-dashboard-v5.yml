name: Rename dashboard to v5 connector identity

on:
  push:
    paths:
      - '.github/workflows/rename-dashboard-v5.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v5 dashboard rename
        run: python3 .github/scripts/rename_dashboard_v5.py

      - name: Validate PHP syntax
        run: |
          php -l api.php
          php -l config.php

      - name: Validate diff
        run: git diff --check

      - name: Commit dashboard rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api.php index.html README.md config.php
          git diff --cached --quiet || git commit -m "refactor: migrate dashboard to v5 connector identity"
          git push

      - name: Remove one-time migration helpers
        run: |
          git rm .github/scripts/rename_dashboard_v5.py .github/workflows/rename-dashboard-v5.yml
          git commit -m "chore: remove dashboard v5 migration helpers"
          git push
