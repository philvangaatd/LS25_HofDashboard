name: Apply live vehicle dashboard cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_vehicle_live.py'
      - '.github/workflows/apply-vehicle-live.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic dashboard cleanup
        run: python3 .github/scripts/apply_vehicle_live.py

      - name: Validate PHP syntax
        run: php -l api.php

      - name: Extract inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = []
          pos = 0
          while True:
              start = text.find('<script', pos)
              if start < 0: break
              start = text.find('>', start) + 1
              end = text.find('</script>', start)
              if end < 0: raise SystemExit('Unclosed script tag')
              scripts.append(text[start:end])
              pos = end + 9
          Path('/tmp/dashboard.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: node --check /tmp/dashboard.js

      - name: Verify canonical vehicle flow
        run: |
          grep -q "source' => 'lua-live'" api.php
          grep -q "'fillUnits' => \$fillUnits" api.php
          grep -q "'shopPrice' => \$shopPrice" api.php
          grep -q 'renderVehicleFillUnits' index.html
          grep -q 'totalAdBlueLiters' index.html
          ! grep -q 'parse_vehicles(' api.php
          ! grep -q 'find_vehicle_fill_capacities(' api.php

      - name: Verify diff
        run: git diff --check

      - name: Commit application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api.php index.html
          if git diff --cached --quiet; then
            echo 'No application changes to commit'
          else
            git commit -m 'refactor: make Lua vehicle data canonical'
            git push
          fi
